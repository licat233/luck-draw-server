Name: luckdraw-mq
Host: 0.0.0.0
Port: 7033

Debug: true

Log:
  ServiceName: luckdraw-mq
  Level: error
  Mode: file

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 7107
  Path: /metrics

#链路追踪
Telemetry:
  Name: luckdraw-mq
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

Mysql:
  DataSource: luck_draw:123123123@tcp(127.0.0.1:3306)/luck_draw?parseTime=True&charset=utf8mb4&collation=utf8mb4_general_ci&loc=Asia%2FShanghai

Redis:
  Host: 127.0.0.1:6379
  Pass:
  Type: node

CacheRedis:
  - Host: 127.0.0.1:6379
    Pass:
    Type: node

LuckdrawRpc:
  Endpoints:
    - 127.0.0.1:7032
  NonBlock: true
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: luckdraw.rpc

#kafka配置
GoodluckConf:
    Name: GoodluckStatus
    Brokers:
      - localhost:9092
    Group: luckdraw-group
    Topic: goodluck-topic
    Offset: first
    Consumers: 1
    Processors: 1
