Name: captcha-api
Host: 0.0.0.0
Port: 7021
Debug: true

Log:
  Level: error
  Mode: file

RootDir: ./

#监控
Prometheus:
  Host: 0.0.0.0
  Port: 7103
  Path: /metrics

#链路追踪
Telemetry:
  Name: captcha-api
  Endpoint: http://jaeger:14268/api/traces
  Sampler: 1.0
  Batcher: jaeger

CaptchaRpc:
  Endpoints:
    - 127.0.0.1:7022
  NonBlock: true
  # Etcd:
  #   Hosts:
  #     - 127.0.0.1:2379
  #   Key: captcha.rpc

Redis:
  Addr: redis:6379
  Pass: redis123123123
  Type: node
  DB: 1