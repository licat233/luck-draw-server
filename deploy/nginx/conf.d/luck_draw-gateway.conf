server {
    listen 80;
    listen 443 ssl http2;
    server_name luckdraw.com www.luckdraw.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /web/admin;

    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #HTTP_TO_HTTPS_START
    # if ($server_port !~ 443) {
    #     rewrite ^(/.*)$ https://$host$1 permanent;
    # }
    #error_page 404/404.html;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 5m;
    #SSL-END

    #ERROR-PAGE-START  404配置，可以注释、删除或修改
    error_page 404 /static/404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #禁止访问的文件或目录
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    #设置代理，指向本地端口
    # proxy_pass http://localhost:3000/;
    # proxy_redirect off;

    # 允许跨域请求的域，*代表所有
    add_header 'Access-Control-Allow-Origin' *;
    # 允许带上cookie请求
    add_header 'Access-Control-Allow-Credentials' 'true';
    #允许请求的方法，比如 GET/POST/PUT/DELETE
    add_header 'Access-Control-Allow-Methods' *;
    # 允许请求的header
    add_header 'Access-Control-Allow-Headers' *;

    # 请求头加入IP地址
    proxy_set_header X-Real_IP $remote_addr;
    # Socket.IO Support
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_http_version 1.1;

    #代理端口
    location /v1/api/admin/ {
        proxy_pass http://luck_draw:7011;
        #proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection 'upgrade';
    }
    
    location /v1/api/captcha/ {
        proxy_pass http://luck_draw:7021;
        #proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection 'upgrade';
    }

    location /v1/api/luckdraw/ {
        proxy_pass http://luck_draw:7031;
        #proxy_set_header Upgrade $http_upgrade;
        #proxy_set_header Connection 'upgrade';
    }

    # #静态资源配置-图片(会优先匹配，导致前面的无效)
    # location ~/static/.*\.(jpg|png|jpeg|gif|ico|svg|webp|bmp|swf)$ {
    #     root /Users/licat/Desktop/project/luck_draw-server/;
    # }

    # # # #静态资源配置-文件(会优先匹配，导致前面的无效)
    # location ~/static/.*\.(js|css|json|txt)$ {
    #     root /Users/licat/Desktop/project/luck_draw-server/;
    # }
    # 使用 root 声明的是根目录，经过 location 匹配后，直接去根目录下找访问路径中 sever_name 后面的文件地址。
    # 使用 alias 声明的是别名目录，经过 location 匹配后，去别名目录下找访问路径中 sever_name 后面除去 location 匹配的地址的剩余地址。这就好像给 location 匹配的地址取了个别名一样。
    #静态文件夹配置
    location /static/ {
        root /web;
        # autoindex on;
    }
    #静态文件夹配置
    location /static {
        alias /web/static/;
        # autoindex on;
    }
}

