version: '3.7'

######## app下api+rpc ,  Before starting this project, start the environment that the project depends on docker-compose-env.yml #######


# 网络配置
networks:
  catli_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
# 服务容器配置
services:
  nginx-gateway:
    image: nginx:1.21.5
    container_name: nginx-gateway
    restart: always
    privileged: true
    environment:
      - TZ=Asia/Shanghai
    ports:
      - 8888:8081
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d
      - ./data/nginx/log:/var/log/nginx
    networks:
      - catli_net
    depends_on:
      - luck_draw-server
  admin-api:
    build: 
      context: ./service/v1/admin/api
    ports:
      - 7001:7001
    depends_on:
      - mysql
      - redis
    environment:
      - TZ=Asia/Shanghai
      - GOPROXY=https://goproxy.cn,direct
    working_dir: /luck_draw-server
    restart: always
    privileged: true
    stdin_open: true   # 打开标准输入，可以接受外部输入
    tty: true
    networks:
      - catli_net

  admin-rpc:
    build: 
      context: ./service/v1/admin/rpc
    depends_on:
      - mysql
      - redis
    environment:
      - TZ=Asia/Shanghai
      - GOPROXY=https://goproxy.cn,direct
    working_dir: /luck_draw-server
    restart: always
    privileged: true
    stdin_open: true   # 打开标准输入，可以接受外部输入
    tty: true
    networks:
      - catli_net

