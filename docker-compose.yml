version: '3.7'
services:
  luckdraw-server:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - 7001:7001
      - 7002:7002
      - 7003:7003
      - 3307:3306
    depends_on:
      - mysql
      - redis
    volumes:
      - luckdraw
  redis:
    image: redis
  mysql:
    image: mysql
