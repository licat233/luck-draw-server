[supervisord]
nodaemon=true

[program:redis]
command=redis-server /etc/redis.conf
autorestart=true
startsecs=3
startretries=3

[program:etcd]
command=nohup /usr/local/etcd/etcd > /tmp/etcd.log 2>&1
autorestart=true
startsecs=3
startretries=3

[program:luckdraw]
command=/luck_draw-server/start-linux.sh run
