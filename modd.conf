#admin
service/v1/admin/rpc/**/*.go {
    prep: go build -o dist/server/admin-rpc  -v service/v1/admin/rpc/admin.go
    daemon +sigkill: dist/server/admin-rpc -f service/v1/admin/rpc/etc/admin.yaml
}
service/v1/admin/api/**/*.go {
    prep: go build -o dist/server/admin-api  -v service/v1/admin/api/admin.go
    daemon +sigkill: dist/server/admin-api -f service/v1/admin/api/etc/admin-api.yaml
}

